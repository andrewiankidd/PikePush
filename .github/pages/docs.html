<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs — PikePush</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --background: #0e1820;
            --foreground: rgba(14, 24, 32, 0.75);
            --highlight: #8DCFF4;
            --text: #e0e8ee;
            --primary: #fff;
            --secondary: #000;
            --muted: #6f8a9e;
            --card: #16242e;
            --border: #2a3a48;
            --radius: 5px;
        }
        body.light {
            --background: #f0f5f8;
            --foreground: rgba(220, 230, 238, 0.75);
            --highlight: #2a7db3;
            --text: #1a2a36;
            --primary: #0a1218;
            --secondary: #fff;
            --muted: #5a6e80;
            --card: #d8e3eb;
            --border: #b0bfc8;
        }
        @keyframes grain {
            0%, to { transform: translate(0) }
            10% { transform: translate(-5%, -10%) }
            20% { transform: translate(-15%, 5%) }
            30% { transform: translate(7%, -25%) }
            40% { transform: translate(-5%, 25%) }
            50% { transform: translate(-15%, 10%) }
            60% { transform: translate(15%) }
            70% { transform: translateY(15%) }
            80% { transform: translate(3%, 35%) }
            90% { transform: translate(-10%, 10%) }
        }
        body:before {
            content: "";
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='a'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23a)'/%3E%3C/svg%3E");
            opacity: .04;
            z-index: 9999;
            pointer-events: none;
            animation: grain 8s steps(10) infinite;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--background);
            color: var(--text);
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
        }
        a { color: var(--highlight); text-decoration: none; transition: 0.3s; font-weight: 600; }
        a:hover { color: var(--primary); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
        }
        header h2 { color: var(--text); margin: 0; font-size: 16pt; text-transform: uppercase; }
        header nav a {
            color: var(--primary);
            margin-left: 20px;
            text-transform: uppercase;
            font-size: 12pt;
        }
        header nav a:hover { border-bottom: 1px solid var(--highlight); color: var(--highlight); }

        main.wiki-content {
            color: var(--text);
            width: 90%;
            max-width: 900px;
            margin: 0 auto 40px;
            background: var(--foreground);
            border-radius: var(--radius);
            padding: 40px;
        }
        .wiki-content h1 {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }
        .wiki-content h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--highlight);
            margin-top: 2rem;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .wiki-content h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .wiki-content h5 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 1rem;
            font-style: italic;
        }
        .wiki-content p {
            line-height: 1.7;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .wiki-content ul, .wiki-content ol {
            margin: 0.5rem 0 1rem 1.5rem;
            line-height: 1.7;
        }
        .wiki-content li { margin-bottom: 0.3rem; }
        .wiki-content strong { color: var(--primary); }
        .wiki-content code {
            background: var(--card);
            padding: 0.15em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .wiki-content pre {
            background: var(--card);
            padding: 1rem;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--border);
        }
        .wiki-content pre code { background: none; padding: 0; }
        .wiki-content img { max-width: 100%; border-radius: var(--radius); }
        .wiki-content blockquote {
            border-left: 3px solid var(--highlight);
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            color: var(--muted);
            background: var(--card);
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        @media (max-width: 700px) {
            main.wiki-content { padding: 20px; width: 95%; }
            header { padding: 20px; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h2>PikePush</h2>
        <nav>
            <a href="javascript:toggleLightMode();">🌗</a>
            <a href="./">Home</a>
            <a href="changelog.html">Changelog</a>
            <a href="docs.html">Docs</a>
        </nav>
    </header>

    <main class="wiki-content" id="content" role="main">
        <p>Loading...</p>
    </main>

    <script>
        function toggleLightMode() {
            document.body.classList.toggle("light");
            localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
        }
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light");
        }

        // PikePush has a single source of docs — the repo README. Fetch and
        // render it through marked so the HTML formatting (shields block,
        // screenshot) stays intact.
        fetch("README.md")
            .then(function(r) {
                if (!r.ok) throw new Error("Not found");
                return r.text();
            })
            .then(function(md) {
                document.getElementById("content").innerHTML = marked.parse(md);
            })
            .catch(function() {
                document.getElementById("content").innerHTML = "<h1>Docs</h1><p>README not available yet.</p>";
            });
    </script>
</body>
</html>
