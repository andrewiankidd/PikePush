name: Build and Deploy
on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  UNITY_MAJOR_VERSION: 6000
  UNITY_MINOR_VERSION: 4
  UNITY_PATCH_VERSION: 7f1

jobs:
  build:
    name: Building for ${{ matrix.name }} 🛠️
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX
          - StandaloneWindows64
          - StandaloneLinux64
          - WebGL

        include:
          - targetPlatform: StandaloneOSX
            name: 'OSX 🍎'
            channel: 'mac'

          - targetPlatform: StandaloneWindows64
            name: 'Windows 🪟'
            channel: 'windows'

          - targetPlatform: StandaloneLinux64
            name: 'Linux 🐧'
            channel: 'linux'

          - targetPlatform: WebGL
            name: 'WebGL 🌐'
            channel: 'webgl'

          - targetPlatform: Android
            name: 'Android 🤖'
            channel: 'android'

          - targetPlatform: iOS
            name: 'iOS 🍏'
            channel: 'ios'
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: 🗃️ Caching
        uses: actions/cache@v4
        with:
          path: src/Library
          key: src/Library-${{ matrix.targetPlatform }}-${{ env.UNITY_MAJOR_VERSION }}.${{ env.UNITY_MINOR_VERSION }}.${{ env.UNITY_PATCH_VERSION }}

      - name: 📁 Create the build path
        run: mkdir Build

      - name: 🏗️ Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_MAJOR_VERSION }}.${{ env.UNITY_MINOR_VERSION }}.${{ env.UNITY_PATCH_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: src
          buildsPath: Build
          buildMethod: UnityBuilderAction.Builder.BuildProject
          allowDirtyBuild: true

      - name: 🗜️ Compress Release
        run: |
          sudo chmod -R 777 Build && \
          cd Build && \
          zip -r "Build-${{ matrix.targetPlatform }}.zip" "${{ matrix.targetPlatform }}"

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.targetPlatform }}-release
          path: Build/Build-${{ matrix.targetPlatform }}.zip

  release_rolling:
    name: 🔄 Refresh latest-main release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename artifacts for stable download URLs
        run: |
          for f in dist/Build-*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f" | sed 's/^Build-//' | sed 's/\.zip$/-release.zip/')
            mv "$f" "dist/$base"
          done
          ls -lh dist/

      - name: Delete previous latest-main release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Publish rolling latest-main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: 'Latest main build'
          prerelease: true
          make_latest: 'false'
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `master` at commit `${{ github.sha }}`.
          files: dist/*

  release_tag:
    name: 🏷️ Create tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename artifacts for stable download URLs
        run: |
          for f in dist/Build-*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f" | sed 's/^Build-//' | sed 's/\.zip$/-release.zip/')
            mv "$f" "dist/$base"
          done
          ls -lh dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Pike Push ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*

  publish_web:
    name: Publish to GitHub Pages 🕸️
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Download WebGL Build artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-release
          path: .

      - name: Extract and move WebGL
        run: |
          unzip -q Build-WebGL.zip
          mv WebGL/WebGL .github/pages

      - name: Stage markdown sources for changelog.html / docs.html
        run: |
          cp CHANGELOG.md .github/pages/ 2>/dev/null || true
          cp README.md .github/pages/ 2>/dev/null || true
          cp -r docs .github/pages/docs 2>/dev/null || true

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: .github/pages
