<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e1820;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e8ee;
    }
    #unity-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0e1820;
      outline: none;
    }
    /* Loading overlay centred on top of the (still-blank) canvas. */
    #unity-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
      text-align: center;
    }
    #unity-loading h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
    }
    #unity-loading-bar {
      width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    #unity-loading-fill {
      width: 0;
      height: 100%;
      background: #8DCFF4;
      transition: width 120ms ease-out;
    }
    #unity-fullscreen-button {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 4px;
      cursor: pointer;
      color: #e0e8ee;
      font-size: 18px;
      user-select: none;
      z-index: 10;
    }
    #unity-fullscreen-button:hover { background: rgba(0, 0, 0, 0.85); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="unity-loading">
    <h1>{{{ PRODUCT_NAME }}}</h1>
    <div id="unity-loading-bar"><div id="unity-loading-fill"></div></div>
  </div>

  <div id="unity-fullscreen-button" title="Fullscreen (F11 also works in most browsers)">⛶</div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas         = document.querySelector("#unity-canvas");
    var loadingEl      = document.querySelector("#unity-loading");
    var fillEl         = document.querySelector("#unity-loading-fill");
    var fullscreenBtn  = document.querySelector("#unity-fullscreen-button");

    // Match the canvas backing-store size to viewport × devicePixelRatio so
    // text renders at native sharpness instead of being upscaled from a
    // fixed 960×600 buffer (Unity's Default template bug).
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      canvas.style.width  = window.innerWidth  + "px";
      canvas.style.height = window.innerHeight + "px";
      canvas.width        = Math.floor(window.innerWidth  * dpr);
      canvas.height       = Math.floor(window.innerHeight * dpr);
    }
    resize();
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    var config = {
      dataUrl:            "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl:       "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:            "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl:          "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl:         "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "{{{ COMPANY_NAME }}}",
      productName:        "{{{ PRODUCT_NAME }}}",
      productVersion:     "{{{ PRODUCT_VERSION }}}",
      matchWebGLToCanvasSize: true,
      devicePixelRatio:   window.devicePixelRatio || 1,
    };

    createUnityInstance(canvas, config, function(progress) {
      fillEl.style.width = (progress * 100) + "%";
    }).then(function(unityInstance) {
      loadingEl.style.display = "none";
      fullscreenBtn.onclick = function() { unityInstance.SetFullscreen(1); };
    }).catch(function(err) {
      loadingEl.innerHTML = "<h1 style='color:#ff8888'>Failed to start</h1><p style='max-width:480px'>" + (err && err.message ? err.message : err) + "</p>";
    });
  </script>
</body>
</html>
